appId: ua.blackoutwidget.app
productName: Blackout Widget
directories:
  output: dist
files:
  - out/**
  - resources/**
  - package.json
  # noble's optional HCI tree: only Linux (or a USB/UART dongle) uses it; Windows and macOS load WinRT/CoreBluetooth.
  - '!**/node_modules/@stoprocent/bluetooth-hci-socket/**'
  - '!**/node_modules/usb/**'
  - '!**/node_modules/serialport/**'
  - '!**/node_modules/@serialport/**'
asarUnpack:
  - '**/node_modules/koffi/**'
  - '**/node_modules/@stoprocent/noble/**'
# Native modules come from their N-API prebuilds (noble's darwin one is universal); nothing is compiled.
npmRebuild: false
extraResources:
  - from: resources/tray
    to: tray
win:
  # npm run app:icon: 16-48 px the design's small detail, 64-256 the full one; also the installer's icon.
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: true
  perMachine: false
  # No spaces: the name in latest.yml must be the asset's name on the GitHub release.
  artifactName: Blackout-Widget-Setup-${version}.${ext}
# Makes the builds write latest.yml / latest-mac.yml and app-update.yml. Uploading stays manual (--publish never).
publish:
  provider: github
  owner: Alrighter
  repo: BlackoutWidget
mac:
  # npm run app:icon; electron-builder makes the .icns from it.
  icon: build/icon.png
  target:
    - target: dmg
      arch:
        - arm64
  category: public.app-category.utilities
  # No Apple Developer ID yet: ad-hoc signature so Apple Silicon will run it (Gatekeeper still asks once).
  identity: '-'
  hardenedRuntime: false
  # Menu-bar app: no Dock icon and no app menu bar.
  extendInfo:
    LSUIElement: true
    NSBluetoothAlwaysUsageDescription: 'Blackout Widget читає зарядну станцію EcoFlow через Bluetooth.'
