appId: ua.blackoutwidget.app
productName: Blackout Widget
directories:
  output: dist
files:
  - out/**
  - resources/**
  - package.json
asarUnpack:
  - '**/node_modules/koffi/**'
extraResources:
  - from: resources/tray
    to: tray
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: true
  perMachine: false
mac:
  target:
    - target: dmg
      arch:
        - arm64
  category: public.app-category.utilities
  # No Apple Developer ID yet: ad-hoc signature so Apple Silicon will run it (Gatekeeper still asks once).
  identity: '-'
  hardenedRuntime: false
  # Menu-bar app: no Dock icon and no app menu bar.
  extendInfo:
    LSUIElement: true
