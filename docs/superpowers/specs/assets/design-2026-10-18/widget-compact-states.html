<!DOCTYPE html>
<html lang="uk"><head>
<meta charset="utf-8">
<title>Компакт — усі стани</title>
<script src="fd595838-defc-49f2-9792-a88b447724a0"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1812px; min-height: 2860px; box-sizing: border-box; padding: 48px; background: #121419; color: #eef0f6; font-family: 'Segoe UI Variable Text', 'Segoe UI Variable', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; display: flex; flex-direction: column; gap: 12px; -webkit-font-smoothing: antialiased">
  <div style="display: flex; flex-direction: column; gap: 6px; margin-bottom: 4px">
    <h1 style="margin: 0; font-size: 34px; line-height: 40px; font-weight: 700; letter-spacing: -0.6px">Компакт · 290×150</h1>
    <p style="margin: 0; font-size: 15px; line-height: 22px; color: #a7adbd">Крапка стану, великий статус, рядок наступної зміни, смужка доби з півгодинними клітинками і маркером «зараз», підпис. Минулі клітинки приглушені.</p>
  </div>
  <div style="display: grid; grid-template-columns: 220px repeat(4, minmax(0, 1fr)); gap: 12px; align-items: end">
    <div></div>
    <sc-for list="{{cols}}" as="c" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; gap: 2px; padding: 0 4px"><span style="font-size: 14px; font-weight: 600">{{c.name}}</span><span style="font-size: 13px; color: #9ba1b3">{{c.sub}}</span></div>
    </sc-for>
  </div>
  <sc-for list="{{rows}}" as="r" hint-placeholder-count="11">
    <div style="display: grid; grid-template-columns: 220px repeat(4, minmax(0, 1fr)); gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 4px; padding: 20px 8px 0 0">
        <span style="font-size: 15px; line-height: 20px; font-weight: 650">{{r.title}}</span>
        <span style="font-size: 13px; line-height: 18px; color: #9ba1b3; text-wrap: pretty">{{r.note}}</span>
      </div>
      <sc-for list="{{r.cells}}" as="c" hint-placeholder-count="4">
        <div style="height: 226px; box-sizing: border-box; padding-top: 48px; border-radius: 16px; overflow: hidden; display: flex; justify-content: center; align-items: flex-start; background: {{c.wp}}">
          <dc-import name="Compact" scenario="{{c.key}}" theme="{{c.theme}}" hint-size="290px,150px"></dc-import>
        </div>
      </sc-for>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1812,&quot;height&quot;:2860}}">
var WP = {
  light: 'radial-gradient(55% 70% at 12% 18%, #ffd6bd 0%, rgba(255, 214, 189, 0) 70%), radial-gradient(50% 65% at 88% 22%, #c4defc 0%, rgba(196, 222, 252, 0) 70%), radial-gradient(70% 60% at 55% 105%, #e2d6ff 0%, rgba(226, 214, 255, 0) 70%), linear-gradient(170deg, #f7f3ee 0%, #eef1f7 100%)',
  dark: 'radial-gradient(1.2px 1.2px at 18px 22px, rgba(255, 255, 255, 0.75) 0%, rgba(255, 255, 255, 0) 100%) 0 0 / 74px 62px, radial-gradient(45% 60% at 82% 12%, rgba(92, 112, 255, 0.55) 0%, rgba(92, 112, 255, 0) 70%), radial-gradient(55% 60% at 8% 92%, rgba(255, 92, 160, 0.32) 0%, rgba(255, 92, 160, 0) 70%), linear-gradient(180deg, #0b0e18 0%, #10131f 100%)',
  busy: 'repeating-linear-gradient(118deg, rgba(255, 255, 255, 0) 0px 16px, rgba(255, 255, 255, 0.6) 16px 19px, rgba(0, 0, 0, 0) 19px 36px, rgba(0, 0, 0, 0.38) 36px 39px), conic-gradient(from 200deg at 38% 46%, #ff4e50, #fc913a, #f9d423, #34e89e, #0f9bff, #8e54e9, #ff4e50)'
};
var COLS = [
  { theme: 'light', wp: WP.light, name: 'Світла тема', sub: 'світлі шпалери' },
  { theme: 'light', wp: WP.busy, name: 'Світла тема', sub: 'строкаті шпалери' },
  { theme: 'dark', wp: WP.dark, name: 'Темна тема', sub: 'темні шпалери' },
  { theme: 'dark', wp: WP.busy, name: 'Темна тема', sub: 'строкаті шпалери' }
];
var ROWS = [
  ['on', 'Світло є', 'Вимкнення о 15:00 · через 3 год 10 хв'],
  ['off', 'Світла немає', 'Увімкнуть о 19:00 · через 1 год 5 хв'],
  ['maybe', 'Можливе відключення', 'Бурштиновий, у смужці — штриховка'],
  ['emergency', 'Аварійне', 'Червоний бейдж і орієнтовний час відновлення'],
  ['nodata', 'Немає даних', 'Графік на сьогодні ще не отримано, смужка заштрихована'],
  ['stale', 'Дані застаріли', 'Позначка поруч з «оновлено 14:50»'],
  ['warning', 'Попередження', 'Окремий рядок; підпис «оновлено» не зникає'],
  ['nochange', 'Без змін до кінця графіка', 'Відліку немає — до кінця доби змін не буде'],
  ['ecoMatch', 'EcoFlow · збігається', 'Блискавка, «з 14:32», лінія фактичних відключень під смужкою'],
  ['ecoMismatch', 'EcoFlow · не за графіком', 'Статус фактичний, рядок «Не за графіком · з 14:32»'],
  ['ecoOffline', 'EcoFlow · джерело невідоме', 'Приглушений значок; решта — за графіком; «невідомо» заштриховано']
];
class Component extends DCLogic {
  renderVals() {
    return {
      cols: COLS,
      rows: ROWS.map(function (r) {
        return { title: r[1], note: r[2], cells: COLS.map(function (c) { return { key: r[0], theme: c.theme, wp: c.wp }; }) };
      })
    };
  }
}
</script>


</body></html>
